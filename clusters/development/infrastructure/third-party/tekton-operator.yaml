apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-operator
  namespace: flux-system
spec:
  interval: 5m
  path: "./components/third-party/tekton/operator"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      TEKTON_OPERATOR_CHART_VERSION: 0.79.1 # https://artifacthub.io/packages/olm/community-operators/tektoncd-operator
