apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-operator
  namespace: flux-system
spec:
  interval: 5m
  path: "./components/third-party/tekton/operator"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      TEKTON_OPERATOR_CHART_VERSION: v0.80.0 # {"$imagepolicy": "flux-system:tekton-operator-chart:tag"}
