apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radix-easyauth
  namespace: flux-system
spec:
  interval: 5m
  path: "./components/radix-platform/radix-easyauth"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager
    - name: radix-operator
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: radix-flux-config
    substitute:
      RADIX_EASYAUTH_CHART_VERSION: 1.134.2-rc.2 # {"$imagepolicy": "flux-system:radix-easyauth-chart:tag"}
      EASYAUTH_ENTRA_CLIENT_ID: 62477cbd-ddbe-4903-9d60-a071209277a1 # Radix EasyAuth Dev # gitleaks:allow
      EASYAUTH_DEX_MI_CLIENT_ID: f8988038-ab21-4e57-b9a0-200eb6e255be # gitleaks:allow
      EASYAUTH_POSTGRES_USER: Radix SQL server admin - dev # Entra admin group on the Postgres server
      EASYAUTH_POSTGRES_HOST: psql-radix-easyauth-dev.postgres.database.azure.com
      EASYAUTH_DEFAULT_GROUP: a636269f-a967-45b2-bb4e-3e02dbb624a2 # Equinor All # gitleaks:allow
  patches:
    - patch: |-
        # We patch the semver.range instead of using postBuild.substitute to avoid the $quote hack when substitution variable contains YAML control characters (> and *) https://fluxcd.io/flux/components/kustomize/kustomizations/#post-build-substitution-of-numbers-and-booleans
        apiVersion: image.toolkit.fluxcd.io/v1
        kind: ImagePolicy
        metadata:
          name: radix-easyauth-chart
          namespace: flux-system
        spec:
          policy:
            semver:
              range: '>=0.0.0-0'
      target:
        kind: ImagePolicy
        name: radix-easyauth-chart
        namespace: flux-system
