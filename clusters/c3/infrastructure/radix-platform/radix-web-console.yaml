apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radix-web-console
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./components/radix-platform/radix-web-console
  prune: false
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: radix-flux-config
    substitute:
      radixWebConsoleChartVersion: 1.0.0 # {"$imagepolicy": "flux-system:radix-web-console-chart:tag"}
      targetEnvironment: prod
      radixWebConsoleOauth2ClientId: b0e93fde-2466-4ded-aa6b-5aed8b4fbaeb
