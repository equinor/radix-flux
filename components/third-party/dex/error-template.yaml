apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-error-template
  namespace: radix-easyauth
data:
  error.html: |
    {{ template "header.html" . }}

    <style>
      .theme-body {
        background: #f7f7f7;
        color: #3d3d3d;
      }

      .theme-navbar {
        border-bottom: 1px solid #eaeaea;
        box-shadow: none;
        height: 56px;
      }

      .dex-container {
        align-items: center;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        min-height: calc(100vh - 56px);
        padding: 32px 20px;
      }

      .radix-error {
        border-top: 3px solid #007079;
        border-radius: 4px;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.14), 0 3px 4px rgba(0, 0, 0, 0.08);
        box-sizing: border-box;
        margin: 0;
        max-width: 480px;
        padding: 32px;
        text-align: left;
        width: 100%;
      }

      .radix-error__eyebrow {
        color: #007079;
        font-size: 12px;
        font-weight: 600;
        margin: 0 0 12px;
        text-transform: uppercase;
      }

      .radix-error .theme-heading {
        color: #243746;
        font-size: 22px;
        font-weight: 600;
        line-height: 1.3;
        margin: 0 0 12px;
      }

      .radix-error__message {
        line-height: 1.5;
        margin: 0;
      }

      .radix-error__type {
        border-top: 1px solid #eaeaea;
        color: #6f6f6f;
        font-size: 13px;
        margin: 24px 0 0;
        padding-top: 16px;
      }

      @media (max-width: 480px) {
        .radix-error {
          padding: 24px;
        }
      }
    </style>

    <main class="theme-panel radix-error" role="alert">
      <p class="radix-error__eyebrow">Radix sign-in</p>
      <h1 class="theme-heading">We couldn't sign you in</h1>
      <p class="radix-error__message">{{ .ErrMsg }}</p>
      <p class="radix-error__type">{{ .ErrType }}</p>
    </main>

    {{ template "footer.html" . }}