apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-error-template
  namespace: radix-easyauth
data:
  error.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light">
        <title>Radix sign-in</title>
        <style>
          :root {
            color: #3d3d3d;
            background: #f7f7f7;
            font-family: Equinor, "Source Sans Pro", sans-serif;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
          }

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            min-height: 100vh;
          }

          .topbar {
            align-items: center;
            background: #fff;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            height: 56px;
            padding: 0 24px;
          }

          .brand {
            align-items: center;
            color: #3d3d3d;
            display: inline-flex;
            font-size: 16px;
            font-weight: 600;
            gap: 8px;
            text-decoration: none;
          }

          .brand-logo {
            height: 32px;
            width: 32px;
          }

          .page {
            align-items: center;
            display: flex;
            justify-content: center;
            min-height: calc(100vh - 56px);
            padding: 32px 20px;
          }

          .error-panel {
            background: #fff;
            border-top: 3px solid #eb0000;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.14), 0 3px 4px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            padding: 32px;
            width: 100%;
          }

          .eyebrow {
            color: #b30d2f;
            font-size: 12px;
            font-weight: 600;
            margin: 0 0 12px;
            text-transform: uppercase;
          }

          h1 {
            color: #243746;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.3;
            margin: 0 0 12px;
          }

          .message {
            line-height: 1.5;
            margin: 0;
          }

          .guidance {
            color: #565656;
            line-height: 1.5;
            margin: 12px 0 0;
          }

          .error-type {
            border-top: 1px solid #eaeaea;
            color: #6f6f6f;
            font-size: 13px;
            margin: 24px 0 0;
            padding-top: 16px;
          }

          @media (max-width: 480px) {
            .topbar {
              padding: 0 16px;
            }

            .error-panel {
              padding: 24px;
            }
          }
        </style>
      </head>
      <body>
        <header class="topbar">
          <span class="brand">
            <svg class="brand-logo" viewBox="0 0 48 48" role="img" aria-label="Radix">
              <g fill="none" stroke="#FF1243" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19.5010505 19.0323946c-.1606586-2.4745046.6549939-5.9524726 2.3607749-8.6755137C24.1748936 6.6643915 27.8748111 4.5 33 4.5h.5v.5c0 10.0701025-5.4406847 14.9048912-13.525049 14.4993722l-.445031-.0223232z" />
                <path d="M27 11c-3.3333333 2.6666667-5.6666667 5.3333333-7 8-2.6666667 4 0 12 7 24" />
                <path d="M22 33c5.6666667 4 11.3333333 5.4166667 17 4.25M24 38c-4 3.3333333-8 4.3333333-12 3M20 29c-1 4-4 8-12 9" />
              </g>
            </svg>
            Radix
          </span>
        </header>
        <main class="page">
          <section class="error-panel" role="alert">
            <p class="eyebrow">Sign-in issue</p>
            <h1>We couldn't sign you in</h1>
            <p class="message">{{ .ErrMsg }}</p>
            <p class="guidance">Return to the application and try again. If the problem continues, contact your Radix administrator.</p>
            <p class="error-type">{{ .ErrType }}</p>
          </section>
        </main>
      </body>
    </html>
